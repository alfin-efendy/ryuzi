name: release
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # One GitHub release per cycle: only crates/control creates a release + tag
    # (vX.Y.Z). cockpit and core are skip-github-release packages — they keep
    # independent versions and changelogs in the same release PR, and the
    # cockpit installers are uploaded onto that release by the jobs below
    # (skipped packages emit no action outputs, so nothing cockpit-* here).
    outputs:
      release_created: ${{ steps.rp.outputs['crates/control--release_created'] }}
      tag_name: ${{ steps.rp.outputs['crates/control--tag_name'] }}
    steps:
      # skip-github-release packages never get tags from release-please (tags
      # only come with GitHub releases), yet its fallback lookup for "last
      # release" is the tag `<component>-v<manifest version>`. Without these
      # tags, every release merge spawns a phantom release PR that restarts
      # cockpit/core at 0.1.0 with a full-history changelog (that was PR #66).
      # Anchor = the last commit that touched the manifest, i.e. the release
      # commit that stamped the versions currently in it. Runs BEFORE the
      # release-please step so the tags exist by the time it looks for them.
      - name: Tag skipped packages (cockpit, core) so release-please keeps tracking them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          anchor=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=.release-please-manifest.json&per_page=1" -q '.[0].sha')
          manifest=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${anchor}" -q '.content' | base64 -d)
          for entry in "cockpit=apps/cockpit/src-tauri" "core=crates/core"; do
            component="${entry%%=*}" path="${entry#*=}"
            version=$(printf '%s' "$manifest" | jq -r --arg p "$path" '.[$p]')
            tag="${component}-v${version}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "${tag} already exists"
            else
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${anchor}" >/dev/null
              echo "created ${tag} @ ${anchor}"
            fi
          done
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # macos-latest: the ONLY host that can link the darwin targets (needs the
    # macOS SDK); the 4 linux targets cross-compile mac->linux via zigbuild.
    # Docker is not available here — images are built by the `docker` job below.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - run: cargo install --locked cargo-zigbuild
      # `--skip=validate` (on the goreleaser step below) is kept deliberately:
      # this job only runs on the release-please merge commit, where goreleaser's
      # tag cross-check adds nothing but flake surface.
      # `--timeout=120m`: goreleaser's default 30m deadline killed v0.8.0 —
      # wasmtime (WASM plugin platform) pushed the 6-target build to ~66m, and
      # the deadline only fires between pipes, so it aborted AFTER the builds
      # finished but before upload. v0.7.0 already sat at ~30m.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate --timeout=120m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 (for the Dockerfile)
      - name: Download the released musl binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.release-please.outputs.tag_name }}" \
            --pattern 'ryuzi-*-linux-musl.tar.gz' -D dl/
          mkdir -p ctx/amd64 ctx/arm64
          tar -xzf dl/ryuzi-*-x86_64-linux-musl.tar.gz  -C ctx/amd64 ryuzi
          tar -xzf dl/ryuzi-*-aarch64-linux-musl.tar.gz -C ctx/arm64 ryuzi
          cp Dockerfile ctx/amd64/ && cp Dockerfile ctx/arm64/
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push, and manifest
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          IMG="ghcr.io/alfin-efendy/ryuzi"
          LABELS="--label org.opencontainers.image.version=${VERSION} \
                  --label org.opencontainers.image.revision=${GITHUB_SHA} \
                  --label org.opencontainers.image.source=https://github.com/alfin-efendy/ryuzi"
          docker buildx build --push --pull --platform linux/amd64 $LABELS -t "$IMG:${VERSION}-amd64" ctx/amd64
          docker buildx build --push --pull --platform linux/arm64 $LABELS -t "$IMG:${VERSION}-arm64" ctx/arm64
          docker buildx imagetools create -t "$IMG:${VERSION}" -t "$IMG:latest" \
            "$IMG:${VERSION}-amd64" "$IMG:${VERSION}-arm64"

  npm:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Download the released binaries (no rebuild — one provenance per release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Anchored pattern: the unified release also carries Cockpit
        # installers; this must only ever match the goreleaser CLI tarballs
        # (ryuzi-<ver>-<platform-tag>.tar.gz), never a future cockpit .tar.gz bundle.
        run: gh release download "${{ needs.release-please.outputs.tag_name }}" --pattern 'ryuzi-*-*-*.tar.gz' -D out/
      - name: Stamp version + assemble packages
        run: |
          VERSION="${TAG#v}"
          bun scripts/npm/set-version.ts "$VERSION"
          ./scripts/npm/assemble.sh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
      - name: Publish platform packages first
        run: |
          for dir in npm/platform/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            ver=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "skip ${name}@${ver} (already published)"
            else
              npm publish "$dir" --access public --provenance
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main package last
        run: |
          name=$(node -p "require('./npm/ryuzi/package.json').name")
          ver=$(node -p "require('./npm/ryuzi/package.json').version")
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "skip ${name}@${ver} (already published)"
          else
            npm publish ./npm/ryuzi --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Cockpit rides the same vX.Y.Z release as the CLI ("one release" model):
  # installers are built from the release tag (whose tree carries the cockpit
  # version release-please stamped into tauri.conf.json) and uploaded onto the
  # CLI release.
  cockpit:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/cockpit-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Builds and ed25519-signs the remote plugin catalog feed (catalog.json +
  # catalog.json.sig — scripts/catalog/build-feed.ts), VERIFIES the signature
  # against the compiled-in CATALOG_FEED_PUBKEY, and uploads both onto this
  # release, so the engine's RemoteCatalogManager
  # (crates/core/src/plugins/remote_catalog.rs) has a feed to fetch. This job
  # is REQUIRED, like `plugins` below: the feed is the ONLY revocation
  # channel (it is how a compromised/broken integration gets blocked without
  # a binary release), so a release that can't ship a verifiable feed must
  # fail here rather than silently leave revocation unusable in the field.
  catalog-feed:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Build + sign the feed
        env:
          CATALOG_FEED_PRIVATE_KEY: ${{ secrets.CATALOG_FEED_PRIVATE_KEY }}
          # Monotonic across releases (increments every workflow run) so each
          # published feed's `sequence` strictly advances — anti-rollback then
          # rejects equal-sequence replay of an older signed feed. `sequence.txt`
          # is a local-build fallback only; CI never commits it back.
          CATALOG_FEED_SEQUENCE: ${{ github.run_number }}
        run: |
          if [ -z "$CATALOG_FEED_PRIVATE_KEY" ]; then
            echo "::error::CATALOG_FEED_PRIVATE_KEY secret is not set — the release cannot ship without a verifiable catalog feed (it is the revocation channel)"
            exit 1
          fi
          bun scripts/catalog/build-feed.ts
      - name: Verify the feed against the compiled-in CATALOG_FEED_PUBKEY
        run: cargo run --locked -p ryuzi-core --bin verify-plugin-artifacts -- catalog catalog.json catalog.json.sig
      - name: Upload catalog.json + catalog.json.sig to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ ! -f catalog.json ] || [ ! -f catalog.json.sig ]; then
            echo "::error::no catalog feed built — the release cannot ship without a verifiable catalog feed (it is the revocation channel)"
            exit 1
          fi
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber catalog.json catalog.json.sig

  # Builds, signs, uploads, then RE-VERIFIES the first-party plugin bundles for
  # this release (scripts/plugins/build-first-party.ts — 19 bundles, dual
  # descriptor stems, plus one <id>.wasm for each of the 18 that declare a
  # [component]; a declarative-only bundle ships descriptors only). Artifacts publish
  # under this release's own immutable tag URL: release builds pin their
  # unversioned fetches to it via RYUZI_RELEASE_TAG, while the catalog feed's
  # update flow fetches versioned stems from `latest`. Like catalog-feed,
  # this job is REQUIRED: a missing FIRST_PARTY_PRIVATE_KEY fails the release
  # rather than shipping apps whose pinned URLs would 404.
  plugins:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false" # release artifacts build clean — see setup-rust's cache input
      - name: Build + sign every component bundle against this tag's URL
        env:
          FIRST_PARTY_PRIVATE_KEY: ${{ secrets.FIRST_PARTY_PRIVATE_KEY }}
          FIRST_PARTY_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.release-please.outputs.tag_name }}
          FIRST_PARTY_OUT_DIR: dist/plugins
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-plugins
        run: |
          if [ -z "$FIRST_PARTY_PRIVATE_KEY" ]; then
            echo "::error::FIRST_PARTY_PRIVATE_KEY secret is not set — the release cannot ship without signed plugin bundles"
            exit 1
          fi
          bun scripts/plugins/build-first-party.ts
      - name: Verify the signed artifacts before upload
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cargo run --locked -p ryuzi-core --bin verify-plugin-artifacts -- dist/plugins \
            --expect-base "https://github.com/${{ github.repository }}/releases/download/$TAG"
      - name: Upload onto the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" --repo "${{ github.repository }}" --clobber dist/plugins/*
      - name: Post-upload verify (fetch back exactly as a client would)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p redownload
          gh release download "$TAG" --repo "${{ github.repository }}" -D redownload/ \
            --pattern '*.wasm' --pattern '*.release.json' \
            --pattern '*.release.json.sig' --pattern '*.ryuzi-plugin.toml'
          cargo run --locked -p ryuzi-core --bin verify-plugin-artifacts -- redownload \
            --expect-base "https://github.com/${{ github.repository }}/releases/download/$TAG"

  # The release is only "done" when every artifact family is present — a
  # partial upload (like v0.4.0, which died mid-pipeline with only some
  # artifact families uploaded) must fail loudly here instead of shipping
  # silently. Also appends the
  # Cockpit section to the release notes (release-please only writes the CLI
  # changelog into the release body).
  finalize:
    needs: [release-please, goreleaser, cockpit, plugins, catalog-feed]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Verify the release carries every artifact family
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          fail=0
          for want in \
            'ryuzi-.+-x86_64-linux-gnu\.tar\.gz' \
            'ryuzi-.+-aarch64-linux-gnu\.tar\.gz' \
            'ryuzi-.+-x86_64-linux-musl\.tar\.gz' \
            'ryuzi-.+-aarch64-linux-musl\.tar\.gz' \
            'ryuzi-.+-x86_64-apple-darwin\.tar\.gz' \
            'ryuzi-.+-aarch64-apple-darwin\.tar\.gz' \
            '^checksums\.txt$' \
            '-setup\.exe$' \
            '\.dmg$' \
            '\.deb$' \
            '\.rpm$' \
            '^cockpit-checksums\.txt$'; do
            echo "$assets" | grep -qE "$want" || { echo "::error::release $TAG is missing an asset matching: $want"; fail=1; }
          done
          exit $fail
      - name: Verify the release carries every plugin bundle (both stems) + the catalog feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          fail=0
          # Derived from the checkout, so a newly added plugins/<id>/ is
          # asserted automatically — same coverage rule as the signer's
          # drift-guard test (build-first-party.test.ts).
          for manifest in plugins/*/ryuzi-plugin.toml; do
            id=$(basename "$(dirname "$manifest")")
            version=$(grep -E '^version *= *"' "$manifest" | head -1 | sed -E 's/^version *= *"([^"]+)".*/\1/')
            wants=( \
              "${id}.ryuzi-plugin.toml" "${id}.release.json" "${id}.release.json.sig" \
              "${id}-${version}.ryuzi-plugin.toml" "${id}-${version}.release.json" "${id}-${version}.release.json.sig")
            # A declarative-only plugin has no [component] and therefore ships
            # no wasm (atlassian-rovo is the first). The signer derives the
            # artifact set from the manifest, so this gate must too — requiring
            # <id>.wasm unconditionally would fail the release for a bundle the
            # signer was never supposed to produce a component for.
            if grep -qE '^\[component\]' "$manifest"; then
              wants+=("${id}.wasm")
            fi
            for want in "${wants[@]}"; do
              echo "$assets" | grep -qxF "$want" || { echo "::error::release $TAG is missing plugin asset: $want"; fail=1; }
            done
          done
          for want in catalog.json catalog.json.sig; do
            echo "$assets" | grep -qxF "$want" || { echo "::error::release $TAG is missing: $want"; fail=1; }
          done
          exit $fail
      - name: Append the Cockpit section to the release notes (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          body=$(gh release view "$TAG" --json body -q .body)
          if printf '%s' "$body" | grep -q '<!-- cockpit-notes -->'; then
            echo "cockpit section already present; skipping"
            exit 0
          fi
          ver=$(jq -r .version apps/cockpit/src-tauri/tauri.conf.json)
          {
            printf '%s\n\n' "$body"
            printf '<!-- cockpit-notes -->\n'
            printf '## Cockpit %s (desktop app)\n\n' "$ver"
            printf 'Installers are attached to this release: `*-setup.exe` (Windows x64/arm64), `.dmg` (macOS universal), `.deb`/`.rpm` (Linux x64/arm64). Verify downloads against `cockpit-checksums.txt`. Changelog: apps/cockpit/src-tauri/CHANGELOG.md.\n'
          } > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
