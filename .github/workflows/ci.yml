name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *" # nightly full matrix, 03:00 WIB
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Computes which areas a PR touches. On push/schedule/dispatch every output
  # is 'true' (full matrix, no filtering). Job-level `if:` gating (instead of
  # `on.paths`) keeps skipped required checks green under branch protection.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ts }}
      rust: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rust }}
      cockpit: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.cockpit }}
      deps: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.deps }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            ts:
              - "packages/**"
              - "apps/cockpit/src/**"
              - "apps/oauth-proxy/src/**"
              - "apps/**/tsconfig*.json"
              - "scripts/**"
              - "tsconfig*.json"
              - "package.json"
              - "bun.lock"
              - ".github/**"
              # Not TypeScript, but the inputs of scripts/test/release-config.test.ts,
              # which pins every release-please `package-name` to the real Cargo
              # `[package] name`. `bun test` runs only in the `ts` job, so without
              # these a package rename (S6 renames ryuzi-control) would set rust=true
              # and ts=false, skipping the one guard that catches the drift.
              # release.yml, the third input, is already covered by `.github/**`.
              - "release-please-config.json"
              - ".release-please-manifest.json"
              - "crates/**/Cargo.toml"
              - "apps/**/Cargo.toml"
            rust:
              - "crates/**"
              - "apps/cockpit/src-tauri/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/**"
            cockpit:
              - "apps/cockpit/**"
              - "packages/ui/**"
              - "bun.lock"
              - ".github/**"
            deps:
              - "bun.lock"
              - "Cargo.lock"
              - "osv-scanner.toml"
              - ".github/**"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bunx biome ci .
      - run: shellcheck install.sh
      - run: bun run check:agentic-cleanup

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Configure git identity (some tests create real commits)
        run: |
          git config --global user.email "ci@ryuzi.dev"
          git config --global user.name "ryuzi CI"
      - run: bun run typecheck
      - run: bun test --isolate

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    # A hung test must fail in minutes, not burn the full 6h GitHub job cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - name: Configure git identity (core tests create real commits)
        run: |
          git config --global user.email "ci@ryuzi.dev"
          git config --global user.name "ryuzi CI"
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy -p ryuzi-core -p ryuzi-control -p ryuzi-plugin-sdk --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      - name: cargo test
        run: cargo test -p ryuzi-core -p ryuzi-control -p ryuzi-plugin-sdk
        timeout-minutes: 20
      # Every first-party plugin crate is its own standalone workspace, NOT a
      # member of the root workspace, so the `-p ryuzi-core ...` run above never
      # executes their `#[cfg(test)]` unit tests — only the ryuzi-core
      # conformance batteries exercise a few of them end-to-end through a built
      # component. Their host bindings live behind `#[cfg(target_arch = "wasm32")]`
      # (see any plugins/<id>/src/lib.rs), so the pure `logic` modules — tool
      # confirmation gates, gateway state machines, provider request/response/error
      # wire mapping — compile and test natively, fast, with no wasm host.
      # One shared CARGO_TARGET_DIR (as in plugins-dry-run.yml) so the common
      # serde_json / wit-bindgen dependencies compile once, not once per crate.
      - name: cargo test — first-party plugin crates
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-plugins
        run: |
          for manifest in plugins/*/Cargo.toml; do
            echo "::group::cargo test $manifest"
            cargo test --manifest-path "$manifest"
            echo "::endgroup::"
          done
      - name: Build + smoke the control-plane binary (absorbs the old build-smoke job)
        run: |
          cargo build -p ryuzi-control
          ./target/debug/ryuzi --version
          ./target/debug/ryuzi --help

  # `ryuzi-cockpit` (apps/cockpit/src-tauri) is a root-workspace member that the
  # `rust` job above does not name, so nothing on a PR ever compiled it — a broken
  # engine.rs / *_cmd.rs merged green and only failed hours later in the nightly
  # cockpit-desktop bundling workflow. Own job because Tauri needs Linux webkit
  # system packages (same list cockpit-desktop.yml installs) and because it can
  # run in parallel with `rust`. Debug profile means Tauri resolves `devUrl`, so
  # no frontend `dist/` build is needed here.
  cockpit-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Install Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: ./.github/actions/setup-bun
      # `tauri-build` resolves `bundle.externalBin` inside build.rs on every
      # compile of this crate — the dev profile too, not just `tauri build` —
      # and the staging slot is a gitignored build artifact, so a clean
      # checkout cannot compile ryuzi-cockpit until the sidecar is in place.
      # Debug profile: nothing in this job runs the binary, it only has to exist.
      - name: Stage the control-plane sidecar
        run: bun run cockpit:sidecar --debug
      - run: cargo clippy -p ryuzi-cockpit --all-targets -- -D warnings
      - name: cargo test
        run: cargo test -p ryuzi-cockpit
        timeout-minutes: 20

  e2e-cockpit:
    needs: changes
    if: needs.changes.outputs.cockpit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      # bunx at repo root misses the workspace-local bin (only apps/cockpit has
      # playwright) and silently falls back to registry-latest, whose browser
      # build can drift from the lockfile-pinned @playwright/test.
      - run: bun run --cwd apps/cockpit playwright install --with-deps chromium
      - run: bun run --cwd apps/cockpit build
      - run: bun run --cwd apps/cockpit e2e:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/cockpit/playwright-report/
          retention-days: 7

  osv:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan lockfiles
        id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=bun.lock
            --lockfile=Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: osv-results
          path: osv-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if the scan found vulnerabilities
        if: steps.scan.outcome == 'failure'
        run: |
          echo "osv-scanner found vulnerabilities — see the osv-results artifact / PR comment."
          echo "Accepted risks belong in osv-scanner.toml with a reason."
          exit 1

  report:
    needs: [changes, lint, ts, rust, cockpit-rust, e2e-cockpit, osv]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # artifact absent when the osv job was skipped
        with:
          name: osv-results
          path: .
      - name: Compose the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/pr-report.sh > report.md
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ci-report
          path: report.md

  # Post-merge safety net: PRs get the sticky comment, main/nightly gets an
  # issue so macOS-only or nightly-only breakage cannot pass silently.
  watchdog:
    needs: [changes, lint, ts, rust, cockpit-rust, e2e-cockpit, osv]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open/update or close the ci-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$NEEDS_JSON")
          existing=$(gh issue list --repo "$REPO" --label ci-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$failed" ]; then
            title="CI failure on ${EVENT}: ${failed}"
            body=$(printf 'Failed jobs: %s\nRun: %s' "$failed" "$RUN_URL")
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$REPO" --title "$title"
              gh issue comment "$existing" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --label ci-failure --title "$title" --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" --comment "Green again: $RUN_URL"
          fi

  # The single branch-protection gate. Matrix jobs report "ts (ubuntu-latest)"
  # when they run but bare "ts" when skipped via `if:` — so per-matrix names
  # can never be required without wedging path-filtered PRs. This job always
  # reports under one stable name and fails iff any needed job failed or was
  # cancelled (skipped = fine by design).
  ci-ok:
    needs: [changes, lint, ts, rust, cockpit-rust, e2e-cockpit, osv]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS_JSON")
          if [ -n "$bad" ]; then
            echo "failed/cancelled: $bad"
            exit 1
          fi
          echo "all gated jobs green or intentionally skipped"
